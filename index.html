<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphe des contacts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <div class="tb-tabs" role="tablist">
    <span class="brand"><svg class="ri brand-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2.5 2.5" stroke-width="3.5"/></svg>Graphe des contacts</span>
    <button class="tb-proj" data-act="projects" title="Projets : liste des projets, ordre choisi à la main, partage"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17 9 4 9-4"/></svg><span id="projName">Projet</span><span id="projDot" hidden title="Ce projet est partagé en direct">●</span></button>
    <span class="tb-tab-list">
    <button class="tb-tab active" data-tab="home" role="tab">Accueil</button>
    <button class="tb-tab" data-tab="file" role="tab">Fichier</button>
    <button class="tb-tab" data-tab="view" role="tab">Affichage</button>
    <button class="tb-tab" data-tab="create" role="tab">Créer</button>
    <button class="tb-tab" data-tab="iso" role="tab">ISO GPS</button>
    </span>
    <div class="tb-right">
      <span id="collabState" hidden></span>
      <div id="presence"></div>
      <div class="tb-qat"><button data-act="undo" title="Annuler — Ctrl+Z" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></span><span class="rb-lb">Annuler</span></button><button data-act="redo" title="Rétablir — Ctrl+Y" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></span><span class="rb-lb">Rétablir</span></button><button data-act="save" title="Enregistrer (.json) — Ctrl+S" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="8"/></svg></span><span class="rb-lb">Enregistrer</span></button></div>
      <button id="propsToggle" title="Afficher ou cacher le panneau de propriétés" aria-pressed="true">◧</button>
      <button id="ribbonToggle" title="Réduire la barre d’outils (plus grand écran)" aria-expanded="true">⌃</button>
    </div>
  </div>
  <div class="tb-ribbon">
  <div class="rb-panel" data-panel="home">
    <div class="rb-group"><div class="rb-items"><button data-act="projects" title="Projets : liste des projets, ordre choisi à la main, partage" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17 9 4 9-4"/></svg></span><span class="rb-lb">Projets</span></button><button data-act="save" title="Enregistrer le projet (.json) — Ctrl+S" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="8"/></svg></span><span class="rb-lb">Enregistrer</span></button></div><div class="rb-group-name">Projet</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="undo" title="Annuler — Ctrl+Z" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></span><span class="rb-lb">Annuler</span></button><button data-act="redo" title="Rétablir — Ctrl+Y" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></span><span class="rb-lb">Rétablir</span></button></div><div class="rb-group-name">Historique</div></div>
    <div class="rb-group"><div class="rb-items"><button data-tool="select" title="Déplacer un élément, ou glisser sur le fond pour déplacer la vue — V / H" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg></span><span class="rb-lb">Déplacer</span></button><button data-act="dup" title="Dupliquer la sélection — Ctrl+D" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></span><span class="rb-lb">Dupliquer</span></button><button data-act="del" title="Supprimer la sélection — Suppr" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg></span><span class="rb-lb">Supprimer</span></button></div><div class="rb-group-name">Édition</div></div>
    <div class="rb-group"><div class="rb-items"><button data-tool="note" title="Ajouter une note sur le graphe — N" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/></svg></span><span class="rb-lb">Note</span></button></div><div class="rb-group-name">Annoter</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="lockpieces" data-toggle="lockpieces" title="Verrouiller la position de toutes les pièces : elles ne bougent plus par mégarde (glisser, flèches)" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span class="rb-lb">Pièces<small class="rb-st" data-on="verrouillées" data-off="libres">libres</small></span></button><button data-act="locksurfaces" data-toggle="locksurfaces" title="Verrouiller la position de toutes les surfaces : elles ne bougent plus par mégarde" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span class="rb-lb">Surfaces<small class="rb-st" data-on="verrouillées" data-off="libres">libres</small></span></button></div><div class="rb-group-name">Verrouillage</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="help" title="Aide : fonctionnement et raccourcis" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg></span><span class="rb-lb">Aide</span></button><button data-act="settings" title="Réglages : affichage, types de surfaces et de liaisons, références automatiques" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2.5 2.5" stroke-width="3"/></svg></span><span class="rb-lb">Réglages</span></button></div><div class="rb-group-name">Aide</div></div>
  </div>
  <div class="rb-panel" data-panel="file" hidden>
    <div class="rb-group"><div class="rb-items"><button data-act="open" title="Ouvrir un fichier .json" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="rb-lb">Ouvrir</span></button><button data-act="save" title="Enregistrer le projet (.json) — Ctrl+S" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="8"/></svg></span><span class="rb-lb">Enregistrer</span></button><button data-act="sharelink" title="Partager le graphe par un simple lien : le JSON est comprimé dans l’URL, aucun fichier à envoyer" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg></span><span class="rb-lb">Lien de partage</span></button></div><div class="rb-group-name">Projet</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="png" title="Exporter la feuille courante en PNG — Ctrl+E" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span><span class="rb-lb">PNG</span></button><button data-act="pngall" title="Exporter toutes les feuilles du projet en PNG (ZIP)" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span><span class="rb-lb">PNG · toutes</span></button><button data-act="svgx" title="Exporter en SVG vectoriel" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8 6-5 6 5 6"/><path d="m16 6 5 6-5 6"/><path d="m14 4-4 16"/></svg></span><span class="rb-lb">SVG</span></button><button data-act="copyimg" title="Copier l’image (à coller dans PowerPoint, Word…)" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="3" width="8" height="4" rx="1"/><rect x="5" y="5" width="14" height="17" rx="2"/></svg></span><span class="rb-lb">Copier l’image</span></button></div><div class="rb-group-name">Exporter image</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="pptx" title="Exporter vers PowerPoint avec des bulles modifiables" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8M12 17v4"/><path d="M8 14v-3M12 14V9M16 14v-5"/></svg></span><span class="rb-lb">PPTX</span></button><button data-act="pdf" title="Imprimer ou enregistrer en PDF : vue d’ensemble puis cycles isolés" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg></span><span class="rb-lb">PDF</span></button></div><div class="rb-group-name">Exporter document</div></div>
  </div>
  <div class="rb-panel" data-panel="view" hidden>
    <div class="rb-group"><div class="rb-items"><button data-act="zoomout" title="Zoom arrière" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6"/></svg></span><span class="rb-lb">Zoom −</span></button><span id="zoomLbl" class="rb-zoom">100%</span><button data-act="zoomin" title="Zoom avant" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6M10 7v6"/></svg></span><span class="rb-lb">Zoom +</span></button><button data-act="fit" title="Ajuster à l’écran — 0" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></span><span class="rb-lb">Ajuster</span></button></div><div class="rb-group-name">Zoom</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="details" data-toggle="details" title="Afficher le détail des liaisons (axe, normale…) sur le graphe" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></span><span class="rb-lb">Détails</span></button><button data-act="grid" data-toggle="grid" title="Afficher la grille de fond" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span><span class="rb-lb">Grille</span></button><button data-act="surfaces" data-toggle="surfaces" title="Afficher les surfaces" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></svg></span><span class="rb-lb">Surfaces</span></button><button data-act="torseurs" data-toggle="torseurs" title="Afficher les torseurs sous les liaisons" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4c-2 0-2 2-2 4v2c0 1-1 2-2 2 1 0 2 1 2 2v2c0 2 0 4 2 4"/><path d="M15 4c2 0 2 2 2 4v2c0 1 1 2 2 2-1 0-2 1-2 2v2c0 2 0 4-2 4"/></svg></span><span class="rb-lb">Torseurs</span></button><button data-act="nominal0" data-toggle="nominal0" title="Afficher le repère nominal 0 des pièces" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 2"/><text x="12" y="16.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" font-family="Arial, sans-serif" font-weight="700">0</text></svg></span><span class="rb-lb">Nominal 0</span></button><button data-act="hints" data-toggle="hints" title="Afficher les aides contextuelles (bandeau d’indications)" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></span><span class="rb-lb">Aides</span></button></div><div class="rb-group-name">Éléments affichés</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="referenceimage" title="Choisir une image locale temporaire" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span><span class="rb-lb">Image de référence</span></button></div><div class="rb-group-name">Références</div></div>
    <div class="rb-group"><div class="rb-items"><button data-act="cyclo" title="Calculer les boucles fermées reliées aux CF sans repasser par une pièce" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="8" cy="12" r="4"/><circle cx="16" cy="12" r="4"/></svg></span><span class="rb-lb">Nbr de cycles</span></button></div><div class="rb-group-name">Analyse</div></div>
  </div>
  <div class="rb-panel" data-panel="create" hidden>
    <div class="rb-group"><div class="rb-items"><button data-tool="piece" title="Nouvelle pièce — P" class="rb-b accent"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></span><span class="rb-lb">Nouvelle pièce</span></button><button data-tool="liaison" title="Nouvelle liaison (Ctrl+clic sur 2 pièces) — L" class="rb-b accent"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/><path d="M8 12h8"/></svg></span><span class="rb-lb">Nouvelle liaison</span></button><button data-tool="surface" title="Surface libre : bulle isolée, sans liaison ni CF — U" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg></span><span class="rb-lb">Surface libre</span></button></div><div class="rb-group-name">Pièces</div></div>
    <div class="rb-group"><div class="rb-items"><button data-tool="rep" title="Groupe de répétition (Ctrl+clic sur les pièces répétées) — R" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/></svg></span><span class="rb-lb">Répétition</span></button><button data-tool="fonc" title="Groupe fonctionnel de pièces (Ctrl+clic sur les pièces) — G" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="5" width="20" height="14" rx="6" stroke-dasharray="3 2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="12" cy="9" r="2"/></svg></span><span class="rb-lb">Groupe de pièces</span></button><button data-tool="ref" title="Groupe de surfaces (Ctrl+clic sur les surfaces) — T" class="rb-b"><span class="rb-ic"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="5" width="20" height="14" rx="6" stroke-dasharray="3 2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="12" cy="9" r="2"/></svg></span><span class="rb-lb">Groupe de surfaces</span></button></div><div class="rb-group-name">Groupes</div></div>
